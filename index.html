                  </p>
                  <div className="space-y-3">
                    {Object.entries(pins).map(([key, data]) => (
                      <button

                        <h4 className="font-bold text-sm">{data.title}</h4>
                        <span className={`text-xs ${activePin === key ? 'text-sky-100' : 'text-slate-500'}`}>{data.coords}</span>

                <div className="lg:col-span-2 relative rounded-2xl overflow-hidden shadow-2xl border-4 border-white">
                  <img

                    <p className="text-slate-200 text-sm leading-relaxed max-w-xl">{pins[activePin].desc}</p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* CROPS & FOOD */}
          <section id="crops" className="py-24 bg-[#f0f5fa]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-12">
                <span className="bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block">
                  Grown at Dog Head Lake
                </span>
                <h2 className="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight mb-4">
                  Farm-to-Table Harvest
                </h2>
                <p className="text-lg text-slate-600 leading-relaxed font-serif">
                  Every crop, vine, and orchard tree is hand-selected to thrive in our rich bottomland soil and fuel our multi-generational family feasts.
                </p>
              </div>

              <div className="flex items-center justify-center flex-wrap gap-2 mb-12">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-sm ${selectedCategory === cat ? 'bg-[#1b61b0] text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

                    onClick={() => setActiveCrop(crop)}
                    className="bg-white rounded-3xl overflow-hidden shadow-lg border border-slate-100 hover:shadow-xl transition-all flex flex-col cursor-pointer group"

                    <div className="relative h-52 overflow-hidden">
                      <img
                        src={crop.image}
                        alt={crop.name}
                        className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                      />
                      <span className="absolute top-3 left-3 bg-white/95 text-slate-900 px-3 py-1 rounded-full text-xs font-bold shadow-md">
                        {crop.category}
                      </span>
                    </div>
                    <div className="p-6 flex flex-col flex-grow justify-between">
                      <div>
                        <h3 className="text-lg font-bold text-slate-900 mb-2 group-hover:text-[#1b61b0] transition-colors">{crop.name}</h3>
                        <p className="text-slate-600 text-xs sm:text-sm line-clamp-2 mb-4 leading-relaxed">{crop.description}</p>
                      </div>
                      <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-semibold text-[#1b61b0]">
                        <span>📅 {crop.harvestSeason}</span>
                        <span>Details →</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* MASTER PLAN */}
          <section id="masterplan" className="py-24 bg-white">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-16">
                <span className="bg-blue-100 text-[#1b61b0] px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block">
                  Architectural Blueprint
                </span>
                <h2 className="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight mb-4">
                  Compound Master Plan
                </h2>
                <p className="text-lg text-slate-600 leading-relaxed font-serif">
                  How 67 acres of raw Northern Mississippi wilderness is being thoughtfully transformed into the ultimate multi-generational family sanctuary.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                {COMPOUND_ZONES.map((zone, idx) => (
                  <div key={zone.id} className="bg-[#f0f5fa] rounded-3xl overflow-hidden shadow-xl border border-slate-200 flex flex-col">
                    <div className="relative h-56">
                      <img src={zone.image} alt={zone.name} className="w-full h-full object-cover" />
                      <span className="absolute top-3 right-3 bg-slate-900/80 text-white px-3 py-1 rounded-full text-xs font-bold">
                        Zone 0{idx + 1}
                      </span>
                    </div>
                    <div className="p-6 sm:p-8 flex flex-col flex-grow justify-between">
                      <div>
                        <div className="text-xs font-bold text-[#1b61b0] mb-2">📍 {zone.coordinates}</div>
                        <h3 className="text-xl font-bold text-slate-900 mb-3">{zone.name}</h3>
                        <p className="text-slate-600 text-sm leading-relaxed mb-6">{zone.description}</p>
                      </div>
                      <div className="pt-4 border-t border-slate-200/60 text-xs font-bold text-slate-700">
                        ⏳ {zone.status}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* PARALLAX SECTION 2: Master Plan Callout */}
          <section className="relative py-96 bg-slate-900 text-white parallax-section" style={{backgroundImage: `linear-gradient(rgba(19, 72, 133, 0.8), rgba(19, 72, 133, 0.8)), url('assets/image/1000014554.jpg')`}}>
            <div className="max-w-5xl mx-auto px-4 text-center">
              <span className="bg-white/25 text-white px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block backdrop-blur-md">
                Master Plan Progress
              </span>
              <h2 className="text-3xl sm:text-5xl font-black mb-6 tracking-tight font-serif italic">
                "From raw timber to multi-generational memories."
              </h2>
              <p className="text-sky-200 font-bold uppercase tracking-widest text-sm mb-8">
                Phase 1 Under Construction • Docks Operational • Cabins Planned
              </p>
              <a
                href="#masterplan"
                className="inline-block bg-white text-[#1b61b0] font-bold px-8 py-3.5 rounded-2xl shadow-xl hover:bg-slate-100 transition-all"
              >
                Inspect Master Plan ↗
              </a>
            </div>
          </section>

          {/* TIMELINE */}
          <section id="timeline" className="py-24 bg-[#f0f5fa]">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-3xl mx-auto mb-16">
                <span className="bg-blue-100 text-[#1b61b0] px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block">
                  Evolution of Ambition
                </span>
                <h2 className="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight mb-4">
                  Our Journey So Far
                </h2>
              </div>

              <div className="relative border-l-2 border-[#1b61b0]/30 ml-4 sm:ml-32 space-y-12">
                {TIMELINE_EVENTS.map((event, idx) => (
                  <div key={idx} className="relative pl-8 sm:pl-12">
                    <div className="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full bg-[#1b61b0] border-4 border-white shadow-md" />
                    <div className="hidden sm:block absolute -left-32 top-0 w-24 text-right font-black text-[#1b61b0] text-sm uppercase tracking-wider">
                      {event.year}
                    </div>
                    <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-lg border border-slate-200">
                      <span className="sm:hidden inline-block bg-blue-100 text-[#1b61b0] px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2">
                        {event.year}
                      </span>
                      <h3 className="text-xl font-bold text-slate-900 mb-2">{event.title}</h3>
                      <p className="text-slate-600 text-sm sm:text-base leading-relaxed">{event.description}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* FAQ */}
          <section id="faq" className="py-24 bg-white">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-16">
                <span className="bg-blue-100 text-[#1b61b0] px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block">
                  Questions & Answers
                </span>
                <h2 className="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight mb-4">
                  Frequently Asked Questions
                </h2>
              </div>

              <div className="space-y-4">
                {FAQS.map((faq, idx) => {
                  const isOpen = faqOpen === idx;
                  return (
                    <div key={idx} className="bg-[#f0f5fa] rounded-2xl border border-slate-200 overflow-hidden">
                      <button
                        onClick={() => setFaqOpen(isOpen ? null : idx)}
                        className="w-full text-left p-6 font-bold text-slate-900 flex items-center justify-between gap-4"
                      >
                        <span className="text-base sm:text-lg">{faq.question}</span>
                        <span className="text-xl font-bold">{isOpen ? '−' : '+'}</span>
                      </button>
                      {isOpen && (
                        <div className="px-6 pb-6 pt-2 text-slate-600 text-sm sm:text-base leading-relaxed border-t border-slate-200 bg-white">
                          {faq.answer}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-slate-950 text-white py-16 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-12 mb-12">
              <div className="md:col-span-2 space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-[#1b61b0] flex items-center justify-center text-white font-black text-xl">🐶</div>
                  <span className="font-black tracking-wider uppercase text-xl">Dog Head Lake Farms</span>
                </div>
                <p className="text-slate-400 text-sm max-w-sm leading-relaxed font-serif">
                  A 67-acre future family compound and sustainable farm sanctuary in Northern Mississippi. Where sanity meets ambition.
                </p>
                <div className="text-sky-400 font-bold tracking-widest uppercase text-xs">
                  "I Guess We're Doing This"
                </div>
              </div>
              <div className="space-y-3">
                <h4 className="font-bold text-sm uppercase tracking-wider text-slate-300">Quick Navigation</h4>
                <ul className="space-y-2 text-sm text-slate-400">
                  <li><a href="#about" className="hover:text-white">The Vision</a></li>
                  <li><a href="#land" className="hover:text-white">Land & Map</a></li>
                  <li><a href="#crops" className="hover:text-white">Farm & Harvest</a></li>
                  <li><a href="#masterplan" className="hover:text-white">Master Plan</a></li>
                  <li><a href="#timeline" className="hover:text-white">Timeline</a></li>
                </ul>
              </div>
              <div className="space-y-3">
                <h4 className="font-bold text-sm uppercase tracking-wider text-slate-300">Location</h4>
                <p className="text-sm text-slate-400">Northern Mississippi (Dog Head Cove)</p>
                <p className="text-sm text-slate-400">Lat/Long: 34.2960° N, 88.8143° W</p>
                <a href="https://www.google.com/maps/@34.2960715,-88.8143986,868m/data=!3m1!1e3" target="_blank" rel="noopener noreferrer" className="text-xs font-bold text-sky-400 hover:underline block pt-2">
                  View on Google Maps ↗
                </a>
              </div>
            </div>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 border-t border-slate-900 text-xs text-slate-500 text-center sm:text-left">
              © {new Date().getFullYear()} Dog Head Lake Farms. All rights reserved. Built with ambition and plenty of sweet tea.
            </div>
          </footer>

          {/* CROP MODAL */}
          {activeCrop && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl relative">
                <button
                  onClick={() => setActiveCrop(null)}
                  className="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-black/50 text-white hover:bg-black flex items-center justify-center"
                >
                  ✕
                </button>
                <div className="relative h-64 sm:h-72">
                  <img src={activeCrop.image} alt={activeCrop.name} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent flex items-end p-6">
                    <div>
                      <span className="bg-[#1b61b0] text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2 inline-block">
                        {activeCrop.category}
                      </span>
                      <h3 className="text-2xl sm:text-3xl font-black text-white">{activeCrop.name}</h3>
                    </div>
                  </div>
                </div>
                <div className="p-6 sm:p-8 space-y-6">
                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">About This Crop</h4>
                    <p className="text-slate-700 text-base leading-relaxed">{activeCrop.description}</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="bg-[#f0f5fa] p-4 rounded-2xl border border-slate-200">
                      <span className="text-[#1b61b0] font-bold text-sm block mb-1">📅 Harvest Season</span>
                      <p className="text-slate-700 text-sm font-medium">{activeCrop.harvestSeason}</p>
                    </div>
                    <div className="bg-[#f0f5fa] p-4 rounded-2xl border border-slate-200">
                      <span className="text-emerald-700 font-bold text-sm block mb-1">🍽️ Culinary Use</span>
                      <p className="text-slate-700 text-sm font-medium">{activeCrop.culinaryUse}</p>
                    </div>
                  </div>
                  <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl">
                    <h5 className="font-bold text-amber-900 text-xs uppercase tracking-wider mb-1">Compound Lore</h5>
                    <p className="text-amber-800 text-sm italic">{activeCrop.funFact}</p>
                  </div>
                  <div className="flex justify-end pt-2">
                    <button
                      onClick={() => setActiveCrop(null)}
                      className="bg-slate-900 hover:bg-[#1b61b0] text-white font-bold px-6 py-3 rounded-xl text-sm transition-colors"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FAMILY PORTAL MODAL */}
          {portalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl relative">
                <button
                  onClick={() => setPortalOpen(false)}
                  className="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center justify-center"
                >
                  ✕
                </button>
                <div className="bg-[#1b61b0] p-6 sm:p-8 text-white">
                  <div className="w-12 h-12 rounded-2xl bg-white/25 flex items-center justify-center text-2xl mb-4">🐶</div>
                  <h3 className="text-2xl font-black">Family & Guest Portal</h3>
                  <p className="text-sky-100 text-sm mt-1">Coordinate visits, claim cabin bunks, and pitch new farm projects.</p>
                </div>
                <div className="p-6 sm:p-8">
                  {submitted ? (
                    <div className="text-center py-8 space-y-4">
                      <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
                      <h4 className="text-2xl font-black text-slate-900">Request Logged!</h4>
                      <p className="text-slate-600 text-sm max-w-sm mx-auto">
                        Your compound access request has been sent to the family council and recorded in the great spreadsheet. See you at the dock!
                      </p>
                      <button
                        onClick={() => { setSubmitted(false); setPortalOpen(false); }}
                        className="bg-[#1b61b0] text-white font-bold px-8 py-3 rounded-xl text-sm transition-colors mt-4"
                      >
                        Return to Website
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={(e) => { e.preventDefault(); setSubmitted(true); }} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Your Name</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Aunt Sarah & Uncle Dave"
                          value={formData.name}
                          onChange={e => setFormData({...formData, name: e.target.value})}
                          className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#1b61b0] text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Family Branch / Affiliation</label>
                        <select
                          value={formData.branch}
                          onChange={e => setFormData({...formData, branch: e.target.value})}
                          className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#1b61b0] text-sm bg-white"
                        >
                          <option>Cousins Branch North</option>
                          <option>The Founders (Mom & Dad)</option>
                          <option>West Coast Outpost</option>
                          <option>Honorary Dog Enthusiast / Guest</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Proposed Dates</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. July 4th Weekend 2026"
                          value={formData.dates}
                          onChange={e => setFormData({...formData, dates: e.target.value})}
                          className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#1b61b0] text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Primary Mission</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Tomato harvesting, bass fishing, deck lounging"
                          value={formData.intent}
                          onChange={e => setFormData({...formData, intent: e.target.value})}
                          className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#1b61b0] text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Special Notes / Dog Snack Requests</label>
                        <textarea
                          rows="3"
                          placeholder="Bring extra bug spray and dog treats..."
                          value={formData.notes}
                          onChange={e => setFormData({...formData, notes: e.target.value})}
                          className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#1b61b0] text-sm resize-none"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full bg-[#1b61b0] hover:bg-[#134885] text-white font-bold py-3.5 rounded-xl shadow-lg transition-colors text-sm mt-2"
                      >
                        Submit to Family Council
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
